name: Connection strategy oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libpq-18-6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/checkout@v4
        with:
          repository: postgres/postgres
          ref: 724edf9bde9d356724ad384a2e196edc3c9f80f7
          path: .oracle/postgres
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex libssl-dev
      - name: Build pinned libpq with OpenSSL and no GSS
        run: |
          cd .oracle/postgres
          ./configure --without-icu --without-readline --without-zlib --without-gssapi --with-ssl=openssl
          make -j2 -C src/interfaces/libpq
          ./config.status --config
      - name: Build connection helper
        run: |
          cc -I.oracle/postgres/src/interfaces/libpq -I.oracle/postgres/src/include \
            pgconn/testdata/connect2_oracle.c -L.oracle/postgres/src/interfaces/libpq \
            -Wl,-rpath,"$PWD/.oracle/postgres/src/interfaces/libpq" -lpq \
            -o "$RUNNER_TEMP/pgx-connect2-oracle"
      - name: Compare connection transitions
        env:
          PGX_TEST_LIBPQ_CONNECT2: ${{ runner.temp }}/pgx-connect2-oracle
        run: go test ./pgconn -run '^TestConnect2LibpqOracle$' -v -count=1
